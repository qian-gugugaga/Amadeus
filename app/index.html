<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amadeus · Live2D 验证台</title>
    <!-- Cubism Core：必须在任何渲染代码之前加载 -->
    <script src="/live2dcubismcore.min.js"></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; overflow: hidden;
        background: radial-gradient(circle at 50% 20%, #1b2233, #0b0e14 70%);
        color: #d8dee9; font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
      }
      #stage-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #stage-box { flex: 1; min-height: 0; display: grid; place-items: center; }
      canvas { display: block; }
      #panel {
        width: 300px; flex: none; overflow-y: auto;
        background: #11151d; border-left: 1px solid #232b3a; padding: 14px;
      }
      #panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: #7f8ea3; font-weight: 600; }
      .row { margin-bottom: 10px; }
      .row label { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
      .row label b { color: #e2e8f0; font-weight: 500; font-variant-numeric: tabular-nums; }
      input[type=range] { width: 100%; accent-color: #5b8def; }
      select { width: 100%; padding: 6px; background: #151b26; color: #d8dee9; border: 1px solid #2b3547; border-radius: 6px; font: inherit; }
      button {
        width: 100%; padding: 7px 0; margin-bottom: 6px; cursor: pointer;
        background: #1c2534; color: #d8dee9; border: 1px solid #2b3547; border-radius: 6px;
        font: inherit;
      }
      button:hover { background: #243043; }
      #log { margin-top: 12px; font-size: 11px; color: #6b7a90; white-space: pre-wrap; word-break: break-all; }
      #error { color: #ff7b72; }
      #chat { flex: none; border-top: 1px solid #232b3a; background: #0e1219; padding: 10px 12px 12px; }
      #messages { max-height: 150px; overflow-y: auto; margin-bottom: 8px; }
      #messages:empty::after { content: "和她说句话，看表情会不会变。"; color: #4a5768; font-size: 12px; }
      .msg { margin-bottom: 6px; font-size: 13px; }
      .msg.user { color: #8fa8c8; }
      .msg.user::before { content: "你："; color: #55637a; }
      .msg.ai { color: #e8eef7; }
      .msg.ai::before { content: "灯："; color: #5b8def; }
      .msg .tag { font-size: 11px; color: #5b8def; margin-left: 8px; opacity: .8; }
      #chat-form { display: flex; gap: 8px; }
      #chat-input {
        flex: 1; padding: 8px 10px; background: #151b26; border: 1px solid #2b3547;
        border-radius: 6px; color: #d8dee9; font: inherit; outline: none;
      }
      #chat-input:focus { border-color: #3d5580; }
      #chat-form button { width: auto; padding: 8px 18px; margin: 0; }
    </style>
  </head>
  <body>
    <div id="stage-wrap">
      <div id="stage-box">
        <canvas id="stage"></canvas>
      </div>
      <div id="chat">
        <div id="messages"></div>
        <form id="chat-form">
          <input id="chat-input" placeholder="说点什么…（回车发送）" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </div>
    </div>
    <aside id="panel">
      <h2>参数探针</h2>
      <div id="controls"></div>
      <h2>动作</h2>
      <button data-motion="mtn_idle_01">idle</button>
      <button data-motion="mtn_action_01">action</button>
      <button data-motion="mtn_finish_01">finish</button>
      <button data-motion="mtn_play01_01">play01_01</button>
      <button data-motion="mtn_play02_01">play02_01</button>
      <h2>日志</h2>
      <div id="log">加载中…</div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
